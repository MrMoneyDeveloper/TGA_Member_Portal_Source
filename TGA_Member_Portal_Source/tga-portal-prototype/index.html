    <link rel="stylesheet" href="/src/styles.css">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "The Gun Association",
            "description": "A member-focused association prototype supporting responsible ownership, education, compliance administration and professional escalation.",
            "logo": "/tga-logo.png"
          },
          {
            "@type": "WebSite",
            "name": "The Gun Association Member Experience",
            "description": "Membership, training information, assessments, document management and compliance-support pathways."
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              { "@type": "Question", "name": "Who can apply for membership?", "acceptedAnswer": { "@type": "Answer", "text": "Membership categories and eligibility requirements must be confirmed by TGA. Options and fees in this prototype are illustrative." } },
              { "@type": "Question", "name": "Which documents will I need?", "acceptedAnswer": { "@type": "Answer", "text": "Requirements depend on the selected membership path. The portal demonstrates an identity, address and compliance-document checklist." } },
              { "@type": "Question", "name": "How do online assessments work?", "acceptedAnswer": { "@type": "Answer", "text": "Members complete assigned demonstration questions, see a pass mark and receive a simulated result. Production content requires TGA approval." } },
              { "@type": "Question", "name": "How will personal information be handled?", "acceptedAnswer": { "@type": "Answer", "text": "Application data is not transmitted by this prototype. Production requires private storage, access control, retention rules and legally approved POPIA-aligned controls." } }
            ]
          }
        ]
      }
    </script>

      </div>
