<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="The Gun Association member website and interactive portal prototype.">
    <meta name="robots" content="noindex, nofollow">
    <title>The Gun Association | Member experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Italiana&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./app.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="app" aria-live="polite">
      <div class="boot-screen"><img src="/tga-mark.svg" alt=""><span>Preparing the TGA experience</span></div>
    </div>

    <dialog class="site-dialog" id="site-dialog" aria-labelledby="site-dialog-title">
      <div class="dialog-card">
        <header><h2 id="site-dialog-title">Dialog</h2><button class="icon-button" type="button" data-close-dialog aria-label="Close dialog"><iconify-icon icon="solar:close-circle-linear"></iconify-icon></button></header>
        <div id="site-dialog-content"></div>
      </div>
    </dialog>

    <dialog class="site-dialog site-dialog--notice" id="notice-dialog" aria-labelledby="notice-dialog-title">
      <div class="dialog-card">
        <header><h2 id="notice-dialog-title">Notice</h2><button class="icon-button" type="button" data-close-notice aria-label="Close notice"><iconify-icon icon="solar:close-circle-linear"></iconify-icon></button></header>
        <div id="notice-dialog-content"></div>
      </div>
    </dialog>

    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
